services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0-slim
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ${OPEN_WEBUI_DATA_DIR}:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
