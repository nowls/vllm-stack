services:
  vllm-gemma4-moe:
    image: vllm/vllm-openai-rocm:v0.29.0

    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video
      - render

    ipc: host

    environment:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      HSA_ENABLE_IPC_MODE_LEGACY: "0"
      NCCL_PROTO: Simple
      NCCL_DEBUG: INFO
      VLLM_ROCM_USE_AITER: "0"
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      HF_HOME: /root/.cache/huggingface

    volumes:
      - /srv/huggingface:/root/.cache/huggingface

    ports:
      - "8000:8000"

    command:
      - --model
      - RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      - --served-model-name
      - gemma4-26b-a4b-it-fp8
      - --language-model-only
      - --mm-processor-cache-gb
      - "0"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.94"
      - --max-num-seqs
      - "1"
      - --kv-cache-dtype
      - fp8
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /app/vllm/examples/tool_chat_template_gemma4.jinja
      - --limit-mm-per-prompt.image=0
      - --limit-mm-per-prompt.audio=0
      - --async-scheduling
