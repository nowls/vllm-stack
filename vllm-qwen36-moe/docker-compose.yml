services:
  vllm-qwen36-moe:
    image: vllm/vllm-openai-rocm:v0.26.0
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    environment:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      NCCL_PROTO: Simple
      NCCL_DEBUG: INFO
      VLLM_ROCM_USE_AITER: "0"
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /srv/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - --model
      - Qwen/Qwen3.6-35B-A3B-FP8
      - --served-model-name
      - qwen3.6-35b-a3b-moe
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --language-model-only
      - --mm-processor-cache-gb
      - "0"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.92"
      - --kv-cache-dtype
      - bfloat16
      - --max-num-seqs
      - "1"
      - --enable-chunked-prefill
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0-slim
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://vllm-qwen36-moe:8000/v1
      OPENAI_API_KEY: not-used

volumes:
  open-webui-data:
