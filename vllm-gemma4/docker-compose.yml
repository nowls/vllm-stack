services:
  vllm-gemma4:
    image: vllm/vllm-openai-rocm:v0.26.0

    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video
      - render

    ipc: host

    environment:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      NCCL_PROTO: Simple
      NCCL_DEBUG: INFO
      VLLM_ROCM_USE_AITER: "0"
      HF_HOME: /root/.cache/huggingface

    volumes:
      - /srv/huggingface:/root/.cache/huggingface

    ports:
      - "8000:8000"

    command:
      - --model
      - google/gemma-4-31B-it-qat-w4a16-ct
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.92"
      - --max-num-seqs
      - "2"
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /app/vllm/examples/tool_chat_template_gemma4.jinja
      - --limit-mm-per-prompt.image=0
      - --limit-mm-per-prompt.audio=0
      - --async-scheduling
