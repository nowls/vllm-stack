services:
  qwen-architect:
    image: vllm/vllm-openai-rocm:v0.26.0
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    environment:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      NCCL_PROTO: Simple
      NCCL_DEBUG: INFO
      VLLM_ROCM_USE_AITER: "0"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /srv/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - --model
      - Qwen/Qwen3.6-27B-FP8
      - --served-model-name
      - qwen-architect
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --language-model-only
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.54"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "1"
      - --enable-chunked-prefill
      - --reasoning-parser
      - qwen3

  qwen-executor:
    image: vllm/vllm-openai-rocm:v0.26.0
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    environment:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      NCCL_PROTO: Simple
      NCCL_DEBUG: INFO
      VLLM_ROCM_USE_AITER: "0"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /srv/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8001"
    command:
      - --model
      - QuantTrio/Qwen3.6-35B-A3B-AWQ
      - --served-model-name
      - qwen-executor
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --language-model-only
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.42"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "1"
      - --enable-chunked-prefill
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0-slim
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URLS: http://qwen-architect:8000/v1;http://qwen-executor:8001/v1
      OPENAI_API_KEYS: not-used;not-used

volumes:
  open-webui-data:
